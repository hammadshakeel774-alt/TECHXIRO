<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" fill="none" width="240" height="50">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem -->
  <g transform="translate(5, 5)">
    <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#logo-grad)" filter="url(#logo-glow)" />
    <path d="M14 14 L26 26 M26 14 L14 26" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="20" cy="20" r="3" fill="#FFFFFF" />
  </g>

  <!-- Text -->
  <text x="56" y="32" font-family="'Sora', 'Inter', sans-serif" font-weight="700" font-size="22" fill="#F8FAFC" letter-spacing="3">
    TECH<tspan fill="url(#logo-grad)">X</tspan>IRO
  </text>
</svg>
