<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" fill="none" width="100%" height="100%">
  <defs>
    <radialGradient id="hero-bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Glow & Grid -->
  <circle cx="260" cy="260" r="220" fill="url(#hero-bg-glow)" />
  <circle cx="260" cy="260" r="180" stroke="#3B82F6" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="6 6" />
  <circle cx="260" cy="260" r="110" stroke="#6366F1" stroke-opacity="0.2" stroke-width="1" />

  <!-- Network Edges -->
  <g stroke="url(#line-grad)" stroke-width="1.5" opacity="0.7">
    <line x1="120" y1="140" x2="260" y2="90" />
    <line x1="260" y1="90" x2="390" y2="160" />
    <line x1="120" y1="140" x2="160" y2="280" />
    <line x1="160" y1="280" x2="310" y2="300" />
    <line x1="260" y1="90" x2="310" y2="300" />
    <line x1="390" y1="160" x2="430" y2="340" />
    <line x1="310" y1="300" x2="430" y2="340" />
    <line x1="160" y1="280" x2="110" y2="400" />
    <line x1="110" y1="400" x2="270" y2="430" />
    <line x1="310" y1="300" x2="270" y2="430" />
    <line x1="270" y1="430" x2="430" y2="340" />
  </g>

  <!-- Animated Data Nodes -->
  <g fill="#3B82F6">
    <circle cx="120" cy="140" r="8" opacity="0.3" />
    <circle cx="120" cy="140" r="4" fill="#60A5FA" />
    
    <circle cx="260" cy="90" r="10" opacity="0.3" />
    <circle cx="260" cy="90" r="5" fill="#3B82F6" />
    
    <circle cx="390" cy="160" r="8" opacity="0.3" />
    <circle cx="390" cy="160" r="4" fill="#818CF8" />

    <circle cx="160" cy="280" r="12" opacity="0.25" />
    <circle cx="160" cy="280" r="6" fill="#3B82F6" />

    <circle cx="310" cy="300" r="14" opacity="0.2" />
    <circle cx="310" cy="300" r="7" fill="#6366F1" />

    <circle cx="430" cy="340" r="8" opacity="0.3" />
    <circle cx="430" cy="340" r="4" fill="#A78BFA" />

    <circle cx="110" cy="400" r="8" opacity="0.3" />
    <circle cx="110" cy="400" r="4" fill="#3B82F6" />

    <circle cx="270" cy="430" r="10" opacity="0.3" />
    <circle cx="270" cy="430" r="5" fill="#60A5FA" />
  </g>

  <!-- Central Processing Core -->
  <rect x="200" y="200" width="120" height="120" rx="24" fill="#0F172A" stroke="#3B82F6" stroke-width="2" opacity="0.9" />
  <rect x="215" y="215" width="90" height="90" rx="16" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="12 6" />
  <circle cx="260" cy="260" r="18" fill="#3B82F6" opacity="0.2" />
  <circle cx="260" cy="260" r="8" fill="#3B82F6" />

  <!-- Bounding Box Object Detection Indicator -->
  <rect x="340" y="120" width="100" height="70" rx="8" fill="none" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="348" y="136" font-family="monospace" font-size="10" fill="#22C55E">target: 0.99</text>
</svg>
