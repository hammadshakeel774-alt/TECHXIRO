<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="200" height="200">
  <defs>
    <linearGradient id="tx-dark-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2C59" />
      <stop offset="100%" stop-color="#003BDE" />
    </linearGradient>
    
    <linearGradient id="tx-bright-blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="60%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#00D1FF" />
    </linearGradient>

    <filter id="tx-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left T Shape (Dark Blue Gradient) -->
  <path d="M 25 45 L 85 45 C 92 45, 96 48, 102 55 L 122 78 L 92 110 L 72 82 L 52 82 L 52 145 L 25 145 Z" fill="url(#tx-dark-blue)" />

  <!-- Right X Diagonal (Bright Gradient Blue) -->
  <path d="M 60 145 L 98 95 L 140 145 L 175 145 L 122 82 L 152 45 L 122 45 L 95 78 L 60 145 Z" fill="url(#tx-bright-blue)" filter="url(#tx-glow)" />

  <!-- Pixelated Dissolve Particles -->
  <g fill="url(#tx-bright-blue)">
    <!-- Row 1 -->
    <rect x="156" y="42" width="7" height="7" rx="1" />
    <rect x="167" y="34" width="6" height="6" rx="1" />
    <rect x="178" y="24" width="5" height="5" rx="1" />
    <rect x="187" y="14" width="4" height="4" rx="0.5" />

    <!-- Row 2 -->
    <rect x="146" y="32" width="7" height="7" rx="1" />
    <rect x="158" y="22" width="6" height="6" rx="1" />
    <rect x="170" y="14" width="5" height="5" rx="1" />
    
    <!-- Row 3 -->
    <rect x="136" y="24" width="6" height="6" rx="1" />
    <rect x="148" y="12" width="5" height="5" rx="1" />
    <rect x="160" y="4" width="4" height="4" rx="0.5" />

    <!-- Scatter -->
    <rect x="176" y="4" width="3" height="3" />
    <rect x="186" y="28" width="4" height="4" />
  </g>
</svg>
